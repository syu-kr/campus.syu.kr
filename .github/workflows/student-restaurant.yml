name: Manna OCR validation (temporary branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'syu-kr/campus.syu.kr' && github.ref == 'refs/heads/codex/fix-manna-image-detail'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
      - name: Use pinned npm
        run: npm install -g npm@10.9.4
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Restore current public data
        run: npm run pull:crawl-data
      - name: Validate extraction without publishing
        env:
          HAKSIK_API_URL: ${{ secrets.HAKSIK_API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run collect:student-restaurant
      - name: Save menu JSON for original-image comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manna-ocr-validation
          path: public/cafeteria/student-restaurant-1.json
          retention-days: 1
