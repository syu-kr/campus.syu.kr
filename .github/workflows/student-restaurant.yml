name: Weekly Crawl - 만나의집 (기숙사 식당)

on:
  workflow_dispatch:
  push:
    branches: [codex/manna-source-fidelity]

permissions:
  contents: read

concurrency:
  group: manna-source-validation
  cancel-in-progress: false

jobs:
  validate-source:
    if: github.repository == 'syu-kr/campus.syu.kr' && github.ref == 'refs/heads/codex/manna-source-fidelity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.2'
      - name: Use pinned npm
        run: npm install -g npm@10.9.4
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Collect and validate without publication
        env:
          HAKSIK_API_URL: ${{ secrets.HAKSIK_API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run collect:student-restaurant
      - name: Inspect validated public menu only
        run: node -e "process.stdout.write(require('node:fs').readFileSync('public/cafeteria/student-restaurant-1.json','utf8'))"
      - name: Upload validated public menu only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manna-source-validation
          path: public/cafeteria/student-restaurant-1.json
          retention-days: 1
          if-no-files-found: error
