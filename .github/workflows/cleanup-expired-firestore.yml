name: Cleanup Expired Firestore Documents

on:
  schedule:
    # 매일 18:30 UTC (한국 시간 03:30)
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    if: github.repository == 'syu-kr/campus.syu.kr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Use pinned npm
        run: npm install -g npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Cleanup expired Firestore documents
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: npm run cleanup-expired-firestore

      - name: Cleanup stale FCM tokens
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          TOKEN_CLEANUP_DAYS: ${{ vars.TOKEN_CLEANUP_DAYS || '90' }}
        run: npm run cleanup-tokens
