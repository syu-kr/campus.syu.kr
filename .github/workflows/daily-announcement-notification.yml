name: 📢 Daily Announcement Notification

on:
  schedule:
    # 평일 23:00 UTC (한국 시간 08:00) - 월-금만 실행
    - cron: "0 23 * * 0-4"
  # 수동 테스트용
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate copy without FCM, dedupe consumption, or Firestore writes
        required: true
        default: true
        type: boolean

jobs:
  send-notification:
    if: github.repository == 'syu-kr/campus.syu.kr'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📅 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"

      - name: Use pinned npm
        run: npm install -g npm@10.9.4

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Send Daily Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          PUSH_API_KEY: ${{ secrets.PUSH_API_KEY }}
          API_URL: ${{ secrets.API_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PUSH_MODEL: ${{ vars.OPENAI_PUSH_MODEL }}
          PUSH_COPY_AI_ENABLED: ${{ vars.PUSH_COPY_AI_ENABLED }}
          PUSH_COPY_AI_TIMEOUT_MS: ${{ vars.PUSH_COPY_AI_TIMEOUT_MS }}
          PUSH_COPY_AI_MAX_RETRIES: ${{ vars.PUSH_COPY_AI_MAX_RETRIES }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: npm run send-daily-notification

      - name: 📊 Log Success
        if: success()
        run: |
          echo "✅ Daily notification job completed at $(date)"
          echo "### Daily notification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: success" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completed at: $(date -u)" >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 Log Failure
        if: failure()
        run: |
          echo "❌ Daily notification job failed at $(date)"
          echo "### Daily notification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed at: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Check the Send Daily Notification step logs before rerunning. Dedupe locks may require manual inspection." >> "$GITHUB_STEP_SUMMARY"
