name: Rollback Crawl Data

on:
  workflow_dispatch:
    inputs:
      version:
        description: "current.json으로 되돌릴 보존 버전"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crawl-data-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'syu-kr/campus.syu.kr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"

      - name: Use pinned npm
        run: npm install -g npm@10.9.4

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Prepare rollback artifact
        run: >-
          npm run rollback:crawl-data --
          "${{ inputs.version }}"
          "$RUNNER_TEMP/crawl-data-pages-${GITHUB_RUN_ID}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/crawl-data-pages-${{ github.run_id }}
          retention-days: 1

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy rollback to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
