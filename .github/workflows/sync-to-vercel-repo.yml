name: Sync to Vercel Repository

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit SHA or ref to sync
        required: true
        default: main
        type: string
      verify_before_sync:
        description: Run dependency audit and full check before syncing
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        description: Source commit SHA or ref to sync
        required: true
        type: string
      verify_before_sync:
        description: Run dependency audit and full check before syncing
        required: false
        default: true
        type: boolean
    secrets:
      VERCEL_PERSONAL_ACCOUNT_TOKEN:
        required: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder.appspot.com"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
  NEXT_PUBLIC_FIREBASE_VAPID_KEY: "ci-placeholder"
  NEXT_PUBLIC_KAKAO_MAP_KEY: "ci-placeholder"
  PUBLIC_DATA_SERVICE_KEY: "ci-placeholder"
  KMA_NCST_URL: "ci-placeholder"
  KMA_FCST_URL: "ci-placeholder"
  SEOUL_BUS_ARRIVAL_URL: "ci-placeholder"
  GYEONGGI_BUS_ARRIVAL_URL: "ci-placeholder"
  SHUTTLE_LOCATION_URL: "https://ci-placeholder.invalid"
  SHUTTLE_PAGE_URL: "https://ci-placeholder.invalid/page"
  SHUTTLE_REFERER: "https://ci-placeholder.invalid/"
  SHUTTLE_USER_AGENT: "ci-placeholder"
  SHUTTLE_CHALLENGE_SALT: "ci-placeholder"
  LECTURE_TIMETABLE_URL: "ci-placeholder"
  LIBRARY_READING_ROOMS_URL: "ci-placeholder"
  PUSH_API_KEY: "ci-placeholder"
  RATE_LIMIT_SECRET: "ci-placeholder-rate-limit-secret"

jobs:
  source:
    name: Resolve trusted source
    if: >-
      github.repository == 'syu-kr/campus.syu.kr' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      sync: ${{ steps.source.outputs.sync }}
    steps:
      - name: Validate sync source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref || github.event.workflow_run.head_sha }}
          VERIFY_BEFORE_SYNC: ${{ inputs.verify_before_sync }}
        run: |
          echo "sync=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "workflow_run" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual or reusable sync must run from main."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SOURCE_REF" != "main" ] && [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "Manual sync is limited to main. Refusing source_ref=$SOURCE_REF"
            exit 1
          fi

          if [ "$EVENT_NAME" != "workflow_run" ] && [ "$VERIFY_BEFORE_SYNC" != "true" ]; then
            echo "Manual or reusable sync must run verification before pushing to the Vercel repository."
            exit 1
          fi

          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$latest" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Cannot resolve a valid main commit."
            exit 1
          fi
          if [ "$SOURCE_REF" = "main" ] || [ "$SOURCE_REF" = "refs/heads/main" ]; then
            SOURCE_REF="$latest"
          fi
          if [[ ! "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid source commit."
            exit 1
          fi
          if [ "$SOURCE_REF" != "$latest" ]; then
            echo "A newer main commit exists; skip this older source."
            exit 0
          fi
          echo "sha=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "sync=true" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync
    needs: source
    if: needs.source.outputs.sync == 'true'
    concurrency:
      group: sync-to-vercel-repo-${{ vars.VERCEL_DESTINATION_REPO }}-main
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        if: inputs.verify_before_sync
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Setup Python
        if: inputs.verify_before_sync
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Use pinned npm
        if: inputs.verify_before_sync
        run: npm install -g npm@10.9.4

      - name: Install dependencies
        if: inputs.verify_before_sync
        run: npm ci

      - name: Install Python dependencies
        if: inputs.verify_before_sync
        run: python -m pip install -r requirements.txt

      - name: Audit dependencies
        if: inputs.verify_before_sync
        run: npm audit --audit-level=moderate

      - name: Check
        if: inputs.verify_before_sync
        run: npm run check

      - name: Verify latest source before copying
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sync=false" >> "$GITHUB_OUTPUT"
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Refusing an invalid or mismatched source checkout."
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$latest" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Cannot resolve a valid main commit."
            exit 1
          fi
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; skip this older source."
            exit 0
          fi
          echo "sync=true" >> "$GITHUB_OUTPUT"

      - name: Clone destination repository
        if: steps.current.outputs.sync == 'true'
        env:
          VERCEL_PERSONAL_ACCOUNT_TOKEN: ${{ secrets.VERCEL_PERSONAL_ACCOUNT_TOKEN }}
          VERCEL_DESTINATION_REPO: ${{ vars.VERCEL_DESTINATION_REPO }}
        run: |
          if [ -z "$VERCEL_PERSONAL_ACCOUNT_TOKEN" ]; then
            echo "VERCEL_PERSONAL_ACCOUNT_TOKEN secret is not configured."
            exit 1
          fi
          if [ -z "$VERCEL_DESTINATION_REPO" ]; then
            echo "VERCEL_DESTINATION_REPO variable is not configured."
            exit 1
          fi

          DESTINATION_DIR="$(mktemp -d)"
          echo "DESTINATION_DIR=$DESTINATION_DIR" >> "$GITHUB_ENV"
          git clone --depth 1 "https://x-access-token:${VERCEL_PERSONAL_ACCOUNT_TOKEN}@github.com/${VERCEL_DESTINATION_REPO}.git" "$DESTINATION_DIR"

      - name: Copy source files
        if: steps.current.outputs.sync == 'true'
        run: |
          find "$DESTINATION_DIR" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          rsync -a "$GITHUB_WORKSPACE"/ "$DESTINATION_DIR"/ \
            --exclude ".git/" \
            --exclude ".github/workflows/" \
            --exclude ".next/" \
            --exclude "node_modules/" \
            --include ".env.example" \
            --exclude ".env*" \
            --exclude "tsconfig.tsbuildinfo" \
            --exclude ".cache/" \
            --exclude ".cache_ggshield" \
            --exclude ".venv/" \
            --exclude "__pycache__/" \
            --exclude "*.py[cod]" \
            --exclude ".vscode/"

          source_sha="$(git rev-parse HEAD)"
          printf '{"sourceSha":"%s"}\n' "$source_sha" > "$DESTINATION_DIR/public/indexnow-deployment.json"

      - name: Push changes to destination repository
        if: steps.current.outputs.sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Refusing an invalid or mismatched source checkout."
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$latest" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Cannot resolve a valid main commit."
            exit 1
          fi
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; skip this older source."
            exit 0
          fi
          cd "$DESTINATION_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "chore: sync syu-campus for Vercel deployment"
          git push origin main
